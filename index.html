      buyer: { id: 'usr-buyer-consumer', full_name: 'Priya Sharma', email: 'priya@gmail.com', role: 'buyer', buyer_type: 'consumer' },

    // --- MAIN REACT APPLICATION ---
    function App() {
      const [lang, setLang] = useState('en');

      // Current active user session
      const [currentUser, setCurrentUser] = useState(() => {

      // Navigation state
      const [page, setPage] = useState('marketplace'); // landing, marketplace, product, cart, checkout, tracking, farmer, buyer, delivery, admin, help
      const [selectedProductId, setSelectedProductId] = useState('prod-1');
      const [selectedOrderId, setSelectedOrderId] = useState('ORD-1002');
      const [receiptModalOrderId, setReceiptModalOrderId] = useState(null);
      const [messageModalData, setMessageModalData] = useState(null); // { product, farmerName }

      // Marketplace filters
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [maxPrice, setMaxPrice] = useState(150);
      const [organicOnly, setOrganicOnly] = useState(false);
      const [bulkOnly, setBulkOnly] = useState(false);
      const [sortBy, setSortBy] = useState('newest');

      // Sync state to LocalStorage
      useEffect(() => {
        localStorage.setItem('fd_user', JSON.stringify(currentUser));
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('fd_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('fd_orders', JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        localStorage.setItem('fd_cart', JSON.stringify(cart));
      }, [cart]);

      // Cart helpers
      const addToCart = (product, qty) => {
        const minQty = product.minimum_order_quantity || 1;
        const addQty = qty && qty >= minQty ? qty : minQty;
        setCart(prev => {
          const idx = prev.findIndex(item => item.product.id === product.id);
          if (idx > -1) {
            const next = [...prev];
            next[idx].quantity = Math.min(next[idx].quantity + addQty, product.available_quantity);
            return next;
          }
          return [...prev, { product, quantity: Math.min(addQty, product.available_quantity) }];
        });
      };

      const updateCartQty = (productId, newQty) => {
        setCart(prev => prev.map(item => {
          if (item.product.id === productId) {
            return newQty > 0 ? { ...item, quantity: Math.min(newQty, item.product.available_quantity) } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (productId) => {
        setCart(prev => prev.filter(item => item.product.id !== productId));
      };

      const cartTotals = useMemo(() => {
        const subtotal = cart.reduce((sum, it) => {
          let price = it.product.price;
          if (it.product.bulk_min_qty > 0 && it.quantity >= it.product.bulk_min_qty && it.product.bulk_discount_pct > 0) {
            price = price * (1 - it.product.bulk_discount_pct / 100);
          }
          return sum + (price * it.quantity);
        }, 0);
        const uniqueFarmers = new Set(cart.map(it => it.product.farmer_id)).size;
        const deliveryFee = cart.length === 0 ? 0 : uniqueFarmers * 50;
        const platformFee = cart.length === 0 ? 0 : 15;
        const total = subtotal + deliveryFee + platformFee;
        const count = cart.reduce((sum, it) => sum + it.quantity, 0);
        return { subtotal, deliveryFee, platformFee, total, count, uniqueFarmers };
      }, [cart]);

      // Filtered products
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (selectedCategory !== 'all' && p.category_id !== selectedCategory) return false;
          if (organicOnly && !p.is_organic) return false;
          if (bulkOnly && (!p.bulk_discount_pct || p.bulk_discount_pct <= 0)) return false;
          if (p.price > maxPrice) return false;
          if (searchTerm) {
            const term = searchTerm.toLowerCase();
            return p.product_name.toLowerCase().includes(term) ||
                   p.description.toLowerCase().includes(term) ||
                   p.farm_name.toLowerCase().includes(term) ||
                   p.farm_location.toLowerCase().includes(term);
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === 'price_asc') return a.price - b.price;
          if (sortBy === 'price_desc') return b.price - a.price;
          if (sortBy === 'rating') return (b.farmer_rating || 0) - (a.farmer_rating || 0);
          return 0;
        });
      }, [products, selectedCategory, organicOnly, bulkOnly, maxPrice, searchTerm, sortBy]);

      const activeProduct = products.find(p => p.id === selectedProductId) || products[0];
      const activeOrder = orders.find(o => o.id === selectedOrderId) || orders[0];

      return (

                      <div className="w-8 h-8 rounded-lg bg-farm-600 text-white font-extrabold flex items-center justify-center text-xs mb-3">01</div>
                      <h4 className="font-bold text-sm text-slate-900 mb-1">Direct Harvest Listing</h4>
                      <p className="text-xs text-slate-500">Farmers harvest daily and list crops with real quantities and fair prices.</p>
                    </div>

                      <div className="w-8 h-8 rounded-lg bg-amber-600 text-white font-extrabold flex items-center justify-center text-xs mb-3">02</div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                      <div className="w-8 h-8 rounded-lg bg-blue-600 text-white font-extrabold flex items-center justify-center text-xs mb-3">03</div>
                      <h4 className="font-bold text-sm text-slate-900 mb-1">Climate Transit</h4>
                      <p className="text-xs text-slate-500">Verified logistics drivers transport crops safely from farm gates.</p>

                      <div className="w-8 h-8 rounded-lg bg-purple-600 text-white font-extrabold flex items-center justify-center text-xs mb-3">04</div>
                      <h4 className="font-bold text-sm text-slate-900 mb-1">100% Direct Payouts</h4>

                    </div>
                  </div>

                {/* Category Pills Bar */}
                <div className="flex items-center gap-2 overflow-x-auto pb-2">

                {/* Main Filter & Products Grid */}

                  <p className="text-xs text-slate-500">Call Toll-Free Kisan Helpline: <strong>1800-180-1551</strong> (6 AM - 10 PM)</p>
                </div>
                <div className="bg-white p-6 rounded-3xl border border-slate-200 space-y-4 text-xs">
                  <h3 className="font-bold text-slate-900 text-sm">Frequently Asked Questions</h3>
                  <div className="space-y-3">
                    <p className="p-3 bg-slate-50 rounded-xl"><strong>How do farmers get paid?</strong> 100% of the produce value is settled immediately upon delivered confirmation without any middlemen deductions.</p>
                    <p className="p-3 bg-slate-50 rounded-xl"><strong>How is produce fresh?</strong> Crops are harvested hours before dispatch and transported directly without multi-day mandi storage.</p>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* --- FOOTER --- */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-10 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="text-sm font-bold text-white block">FarmDirect – Direct Farmer-to-Buyer Marketplace</span>
                <span>Connecting Indian Agriculture with Fair Prices & Zero Intermediaries</span>
              </div>
              <div className="flex gap-4">
                <button onClick={() => setPage('marketplace')} className="hover:text-white">Marketplace</button>
                <button onClick={() => setPage('help')} className="hover:text-white">Kisan Advisory</button>
              </div>
            </div>
          </footer>

          {/* --- RECEIPT MODAL --- */}
          {receiptModalOrderId && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 text-xs space-y-4">
                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                  <div>
                    <h3 className="font-extrabold text-slate-900 text-base">FarmDirect Tax Invoice</h3>
                    <span className="text-[10px] text-slate-400">Order #{receiptModalOrderId}</span>
                  </div>
                  <button onClick={() => setReceiptModalOrderId(null)} className="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
                </div>
                <div className="p-3 bg-slate-50 rounded-xl space-y-1">
                  <p><strong>Producer:</strong> Lakshmi Organic Farm (Warangal Rural)</p>
                  <p><strong>Billed To:</strong> Priya Sharma (Hyderabad)</p>
                  <p><strong>Status:</strong> COMPLETED & VERIFIED</p>
                </div>
                <div className="pt-2 border-t border-slate-100 flex justify-between font-bold">
                  <span>Total Settled:</span>
                  <span className="text-farm-700 font-black">₹365.00</span>
                </div>
                <button onClick={() => window.print()} className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl">
                  Print Invoice
                </button>
              </div>
            </div>
          )}

          {/* --- DIRECT MESSAGE MODAL --- */}
          {messageModalData && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 text-xs space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-900 text-sm">Contact Farmer Directly</h3>
                  <button onClick={() => setMessageModalData(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                <p className="text-slate-500">Direct message to: <strong>{messageModalData.farmerName}</strong></p>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Proposed Negotiation Price (Optional)</label>
                  <input type="number" placeholder="₹ per unit" className="w-full p-2 border border-slate-300 rounded-lg" />
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Message</label>
                  <textarea rows={3} placeholder="Ask about harvest schedule, bulk delivery availability..." className="w-full p-2 border border-slate-300 rounded-lg" />
                </div>
                <button
                  onClick={() => {
                    alert('Your direct message was sent to the farmer!');
                    setMessageModalData(null);
                  }}
                  className="w-full py-2.5 bg-farm-600 text-white font-bold rounded-xl"
                >
                  Send Message
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
